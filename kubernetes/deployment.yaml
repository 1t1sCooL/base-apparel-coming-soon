apiVersion: apps/v1
kind: Deployment
metadata:
  name: base-apparel-coming-soon-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: base-apparel-coming-soon-app
  template:
    metadata:
      labels:
        app: base-apparel-coming-soon-app
    spec:
      containers:
        - name: base-apparel-coming-soon-app
          image: base-apparel-coming-soon-app:latest
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: 'production'
            - name: MAILER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mailer-secrets
                  key: MAILER_API_KEY
            - name: ENV_SUBST_LIST
              value: 'MAILER_API_KEY,NODE_ENV'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
